<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Add/Edit House</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="admin-form.css">
</head>
<body>
  <a class="skip-to-content" href="#main-content">Skip to main content</a>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <a class="logo" href="../home/home.html">
          <img src="../assets/logo.png" alt="StudentHomes — go to homepage" class="brand-logo">
        </a>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list">
            <li><a href="../home/home.html">Home</a></li>
            <li><a href="../about/about.html">About</a></li>
            <li><a href="../shop/shop.html">Browse Houses</a></li>
            <li><a href="../shop/shop.html">Hot Deals</a></li>
            <li><a href="../contact/contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right"></div>
    </header>
    <div class="nav-overlay"></div>

    <main class="admin-dashboard" id="main-content">
      <div class="container">
        <div class="dashboard-header">
          <div class="header-content">
            <h1 id="form-title">Property Creator</h1>
            <p>Create full property details and upload gallery photos.</p>
          </div>
          <a href="../admin/admin.html" class="btn btn-secondary" id="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 8px;"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back to Dashboard
          </a>
        </div>

        <section class="listings-section">
          <div id="form-skeleton" class="admin-form-skeleton">
            <div class="skeleton-short"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-row">
              <div class="skeleton-block"></div>
              <div class="skeleton-block"></div>
            </div>
            <div class="skeleton-upload"></div>
            <div class="skeleton-button"></div>
          </div>

          <div id="form-body" style="display:none;">
            <div class="form-grid">
              
              <div class="form-group">
                <label>Property Title (Summary)</label>
                <input type="text" id="add-title" class="search-wrapper" placeholder="e.g. Spacious 2 Bedroom Flat near Campus">
              </div>

              <div class="form-group">
                <label>Exact Location / Lodge Name</label>
                <input type="text" id="add-location" class="search-wrapper" placeholder="e.g. Winners Lodge, Beside Winners Chapel">
              </div>

              <div class="skeleton-row" style="margin-bottom: 2rem;">
                <div class="form-group">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.75rem;">
                    <label style="margin:0;">University</label>
                    <button onclick="addNewSchool()" class="btn-accent-sm">+ Add School</button>
                  </div>
                  <select id="add-school" class="search-wrapper"></select>
                </div>

                <div class="form-group">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.75rem;">
                    <label style="margin:0;">Campus Area</label>
                    <button onclick="addNewArea()" class="btn-accent-sm">+ Add Area</button>
                  </div>
                  <select id="add-area" class="search-wrapper"></select>
                </div>
              </div>

              <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
                <div class="form-group">
                  <label>Property Type</label>
                  <select id="add-type" class="search-wrapper"></select>
                </div>
                <div class="form-group">
                  <label>Price (₦)</label>
                  <input type="number" id="add-price" class="search-wrapper" placeholder="e.g. 150000">
                </div>
                <div class="form-group">
                  <label>Number of Rooms</label>
                  <input type="number" id="add-rooms" class="search-wrapper" placeholder="e.g. 1">
                </div>
              </div>

              <div class="form-group">
                <label>Upload Photos (Gallery)</label>
                <div class="upload-zone">
                  <div id="upload-label">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <p>Click or Drag images to upload</p>
                  </div>
                  <input type="file" id="file-upload" multiple accept="image/*" style="opacity:0; position:absolute; inset:0; cursor:pointer;">
                  <div id="preview-container" style="display:flex; flex-wrap:wrap; gap:0.5rem;"></div>
                </div>
              </div>

              <div class="skeleton-row" style="margin-bottom: 2rem;">
                <div class="form-group">
                  <label>Landlord Phone</label>
                  <input type="text" id="add-phone" class="search-wrapper" placeholder="080...">
                </div>
                <div class="form-group">
                  <label>WhatsApp Number</label>
                  <input type="text" id="add-wa" class="search-wrapper" placeholder="080...">
                </div>
              </div>

              <div class="form-group">
                <label>Property Description</label>
                <textarea id="add-desc" class="search-wrapper" placeholder="Water availability, distance from gate, security details..."></textarea>
              </div>

              <button class="btn btn-primary" style="width:100%; height:65px; font-size:1.15rem; margin-top:1rem;" id="btn-submit">
                Publish Property
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/data.js"></script>
  <script src="admin-form.js"></script>
</body>
</html>
