<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Add/Edit House</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="admin-form.css">
</head>
<body>
  <a class="skip-to-content" href="#main-content">Skip to main content</a>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <a class="logo" href="../home/home.html">
          <img src="../assets/logo.png" alt="StudentHomes — go to homepage" class="brand-logo">
        </a>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list">
            <li><a href="../home/home.html">Home</a></li>
            <li><a href="../about/about.html">About</a></li>
            <li><a href="../shop/shop.html">Browse Houses</a></li>
            <li><a href="../shop/shop.html">Hot Deals</a></li>
            <li><a href="../contact/contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right"></div>
    </header>
    <div class="nav-overlay"></div>

    <main class="admin-dashboard" id="main-content">
      <div class="container">
           <div class="dashboard-header">
           <div class="header-content">
              <h1 id="form-title">Property Creator</h1>
              <p>Create full property details and upload gallery photos.</p>
           </div>
           <a href="../admin/admin.html" class="btn btn-secondary" id="back-link">← Back to Dashboard</a>
        </div>

        <section class="listings-section" style="padding: 2.5rem;">
           <div id="form-skeleton" class="admin-form-skeleton" style="display:grid;">
              <div class="skeleton-short"></div>
              <div class="skeleton-block"></div>
              <div class="skeleton-block"></div>
              <div class="skeleton-row">
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
              </div>
              <div class="skeleton-row">
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
              </div>
              <div class="skeleton-upload"></div>
              <div class="skeleton-row">
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
              </div>
              <div class="skeleton-textarea"></div>
              <div class="skeleton-button"></div>
           </div>

           <div id="form-body" style="max-width: 800px; margin: 0 auto; display:none;">
              <div class="stats-grid" style="grid-template-columns: 1fr; gap: 1.5rem;">
                 
                 <div class="form-group">
                   <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Property Title (Summary)</label>
                   <input type="text" id="add-title" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;" placeholder="e.g. Spacious 2 Bedroom Flat near Campus">
                 </div>

                 <div class="form-group">
                   <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Exact Location / Lodge Name</label>
                   <input type="text" id="add-location" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;" placeholder="e.g. Winners Lodge, Beside Winners Chapel">
                 </div>

                 <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                      <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label style="color:var(--muted); margin-bottom:0.5rem;">University</label>
                        <button onclick="addNewSchool()" style="background:var(--accent); color:#000; font-size:0.6rem; padding: 0.2rem 0.5rem; border:none; border-radius:4px; margin-bottom:0.4rem; cursor:pointer;">+ Add New School</button>
                      </div>
                      <select id="add-school" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;"></select>
                    </div>

                    <div class="form-group">
                      <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label style="color:var(--muted); margin-bottom:0.5rem;">Campus Area</label>
                        <button onclick="addNewArea()" style="background:var(--accent); color:#000; font-size:0.6rem; padding: 0.2rem 0.5rem; border:none; border-radius:4px; margin-bottom:0.4rem; cursor:pointer;">+ Add Area</button>
                      </div>
                      <select id="add-area" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;"></select>
                    </div>
                 </div>

                 <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                      <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Property Type</label>
                      <select id="add-type" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;"></select>
                    </div>
                    <div class="form-group">
                      <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Price (₦)</label>
                      <input type="number" id="add-price" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;" placeholder="e.g. 150000">
                    </div>
                    <div class="form-group">
                      <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Number of Rooms</label>
                      <input type="number" id="add-rooms" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;" placeholder="e.g. 1">
                    </div>
                 </div>

                 <div class="form-group">
                   <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Upload Photos (Gallery)</label>
                   <div style="border: 2px dashed #334155; border-radius:16px; padding: 2rem; text-align:center; position:relative;">
                     <p id="upload-label" style="margin-bottom:1rem; color:var(--muted);">Click to browse files (JPEG, PNG...)</p>
                     <input type="file" id="file-upload" multiple accept="image/*" style="opacity:0; position:absolute; inset:0; cursor:pointer;">
                     <div id="preview-container" style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;"></div>
                   </div>
                 </div>

                 <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                      <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Landlord Phone</label>
                      <input type="text" id="add-phone" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;" placeholder="080...">
                    </div>
                    <div class="form-group">
                      <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">WhatsApp Number</label>
                      <input type="text" id="add-wa" class="search-wrapper" style="width:100%; border-radius:12px; height:50px; background:var(--bg); border:1px solid #334155; color:#fff; padding:0 1rem;" placeholder="080...">
                    </div>
                 </div>

                 <div class="form-group">
                   <label style="color:var(--muted); display:block; margin-bottom:0.5rem;">Property Description</label>
                   <textarea id="add-desc" class="search-wrapper" style="width:100%; height:120px; border-radius:12px; padding:1rem; background:var(--bg); border:1px solid #334155; color:#fff; resize:none;" placeholder="Water availability, distance from gate, security details..."></textarea>
                 </div>

                 <button class="btn btn-primary" style="height:60px; font-size:1.2rem; margin-top:1.5rem;" id="btn-submit">Publish Property</button>
              </div>
           </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/data.js"></script>
  <script src="admin-form.js"></script>
</body>
</html>
