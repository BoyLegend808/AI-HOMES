<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AI HOMES</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="logo" onclick="window.location.href='../home/home.html'">
          <img src="../assets/logo.png" alt="StudentHomes" class="brand-logo">
        </div>
      </div>
      <div class="nav-center"></div>
      <div class="nav-right"></div>
    </header>

    <div class="auth-wrapper">
      <div class="auth-card">
        <h2>Set New Password</h2>
        <p>Choose a strong password for your account.</p>

        <div class="form-group">
          <label>New Password</label>
          <div class="password-wrap">
            <input type="password" id="new-pass" class="form-control password-input" placeholder="••••••••" />
            <button type="button" id="toggle-pass" class="password-toggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="auth-btn" id="btn-update-pass">Update Password</button>

        <div class="toggle-auth">
          Changed your mind? <a href="auth.html" style="color:var(--accent); text-decoration:none;">Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('btn-update-pass');
      const input = document.getElementById('new-pass');
      const toggle = document.getElementById('toggle-pass');

      if (toggle && input) {
        toggle.addEventListener('click', () => {
          const isPass = input.type === 'password';
          input.type = isPass ? 'text' : 'password';
        });
      }

      if (btn) {
        btn.addEventListener('click', async () => {
          const pass = input.value.trim();
          if (pass.length < 6) {
            alert('Password must be at least 6 characters.');
            return;
          }

          btn.disabled = true;
          btn.textContent = 'Updating...';
          const res = await window.updateUserPassword(pass);
          btn.disabled = false;
          btn.textContent = 'Update Password';

          if (res.success) {
            alert('Password updated successfully! You can now login.');
            window.location.href = 'auth.html';
          } else {
            alert('Error: ' + (res.error?.message || 'Failed to update password. Session may have expired.'));
          }
        });
      }
    });
  </script>
</body>
</html>
