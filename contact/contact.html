<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="logo" onclick="window.location.href='../home/home.html'">
          <img src="../assets/logo.png" alt="StudentHomes" class="brand-logo">
        </div>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list is-loading">
            <li></li><li></li><li></li><li></li><li></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right">
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </header>
    <div class="nav-overlay"></div>

    <main class="contact-wrapper">
      <div class="contact-header">
        <h1>Get In Touch</h1>
        <p>Questions about a property? Want to list your house? Reach out to us.</p>
      </div>

      <button class="back-link-btn" onclick="window.location.href='../home/home.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          Back to Home
      </button>

      <div class="contact-grid" style="margin-top:2rem;">
        <div class="contact-info">
          <div class="info-block">
            <h3>📍 Office HQ</h3>
            <p>12 Tech Plaza, Abakaliki<br>Ebonyi State, Nigeria</p>
          </div>
          <div class="info-block">
            <h3>📞 Support Line</h3>
            <p>+234 810 000 0000<br>+234 901 111 1111</p>
          </div>
          <div class="info-block">
            <h3>✉️ Email</h3>
            <p>support@studenthome.com<br>landlords@studenthome.com</p>
          </div>
        </div>

        <div class="contact-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="c-name" class="form-control" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="c-email" class="form-control" placeholder="you@university.edu">
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea id="c-message" class="form-control" placeholder="How can we help?"></textarea>
          </div>
          <button class="btn-submit" onclick="submitContact()">Send Message</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/data.js"></script>
  <script src="contact.js"></script>
</body>
</html>
