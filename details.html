<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <style>
    .hero-image {
      height: 320px;
      background-size: cover;
      background-position: center;
      position: relative;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .back-btn {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      background: rgba(17, 21, 28, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .gallery-row {
      display: flex;
      gap: 0.8rem;
      padding: 1.5rem 1.5rem 0 1.5rem;
      overflow-x: auto;
    }
    .gallery-row::-webkit-scrollbar { display: none; }
    .gallery-img {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .gallery-img:hover {
      border-color: var(--accent);
    }
    .details-content {
      padding: 1.5rem;
    }
    .details-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      line-height: 1.2;
    }
    .details-meta {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .price {
      font-size: 1.8rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: block;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .desc {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 2rem;
    }
    .feature-tag {
      background: rgba(255,255,255,0.05);
      padding: 0.8rem;
      border-radius: 12px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkout-wrapper {
      position: sticky;
      bottom: 0;
      padding: 1.5rem;
      background: linear-gradient(to top, var(--bg-panel) 80%, transparent);
    }
    .btn-checkout {
      width: 100%;
      background: var(--accent);
      color: #fff;
      padding: 1.2rem;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-checkout:hover {
      background: #e87b51;
      transform: translateY(-2px);
    }
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-content {
      background: var(--bg-panel);
      width: 100%;
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid var(--card-border);
      text-align: center;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-content h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .contact-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      background: rgba(255,255,255,0.05);
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
    }
    .contact-option.whatsapp { color: #25D366; }
    .contact-option.call { color: var(--accent); }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <!-- UI will be rendered by JS -->
  </div>

  <div class="modal-overlay" id="contact-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h3>Owner Contacts</h3>
      <p style="color:var(--text-muted);margin-bottom:1.5rem;">Reach out to the landlord directly.</p>
      
      <a href="#" class="contact-option call" id="contact-call">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <span id="call-text">Call</span>
      </a>
      
      <a href="#" class="contact-option whatsapp" id="contact-wa">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        <span id="wa-text">WhatsApp</span>
      </a>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    let listing = null;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      
      if(!id) {
         // Default to first listing if directly navigated
         const all = window.getListings();
         if(all.length > 0) listing = all[0];
      } else {
         listing = window.getListingById(id);
      }

      if(!listing) {
        document.getElementById('app').innerHTML = '<div style="padding:2rem;">Listing not found. <a href="shop.html" style="color:var(--accent);">Go back</a></div>';
        return;
      }
      
      renderDetails();
    });

    function renderDetails() {
      const app = document.getElementById('app');
      
      const mainPhoto = listing.photos && listing.photos.length > 0 ? listing.photos[0] : '';
      const photosHtml = (listing.photos || []).map(p => `
        <img src="${p}" class="gallery-img" onclick="setMainImage('${p}')">
      `).join('');

      app.innerHTML = `
        <div class="hero-image" id="main-hero" style="background-image: url('${mainPhoto}')">
          <button class="back-btn" onclick="window.location.href='shop.html'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
        </div>
        
        <div class="gallery-row">
          ${photosHtml}
        </div>

        <div class="details-content">
          <h1 class="details-title">${listing.title}</h1>
          <div class="details-meta">${listing.school || 'Unknown'} • ${listing.area || 'Unknown'}</div>
          <span class="price">₦${listing.price.toLocaleString()}</span>
          
          <h3 class="section-title">Description</h3>
          <p class="desc">${listing.description || 'Verified property listing connected to StudentHome.'}</p>
          
          <h3 class="section-title">Features</h3>
          <div class="features">
            <div class="feature-tag">🛏️ ${listing.rooms || 1} Bedroom</div>
            <div class="feature-tag">🏠 ${listing.type || 'Standard'}</div>
            <div class="feature-tag">✅ Verified</div>
            <div class="feature-tag">📍 Near Campus</div>
          </div>
        </div>

        <div class="checkout-wrapper">
          <button class="btn-checkout" onclick="handleCheckout()">Check Out</button>
        </div>
      `;
    }

    function setMainImage(url) {
      document.getElementById('main-hero').style.backgroundImage = `url('${url}')`;
    }

    function handleCheckout() {
      const user = window.getCurrentUser();
      
      // E-commerce logic: Must be logged in
      if(!user) {
        alert("Please login or create an account to view owner contact details.");
        window.location.href = "auth.html";
        return;
      }

      // Show the contact modal
      document.getElementById('call-text').textContent = 'Call ' + (listing.contact?.phone || "Unavailable");
      document.getElementById('contact-call').href = 'tel:' + (listing.contact?.phone || "");
      
      document.getElementById('wa-text').textContent = 'WhatsApp ' + (listing.contact?.whatsapp || "Unavailable");
      document.getElementById('contact-wa').href = 'https://wa.me/' + (listing.contact?.whatsapp || "");

      document.getElementById('contact-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('contact-modal').style.display = 'none';
    }
  </script>
</body>
</html>
