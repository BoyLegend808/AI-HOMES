<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1.5; url=onboarding/onboarding.html">
    <title>AI HOMES - Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --accent: #F97316;
            --text-main: #F8FAFC;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .splash-container {
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
        }
        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 2rem;
            animation: pulse 2s infinite ease-in-out;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(249, 115, 22, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 1s linear infinite;
        }
        .text {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .redirect-link {
            position: fixed;
            bottom: 2rem;
            font-size: 0.8rem;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .redirect-link:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="assets/logo.png" alt="AI HOMES" class="logo">
        <div class="loader"></div>
        <div class="text">Welcome to AI HOMES</div>
    </div>
    <a href="onboarding/onboarding.html" class="redirect-link">Click here if not redirected</a>
</body>
</html>
