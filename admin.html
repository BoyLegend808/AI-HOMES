<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="logo" onclick="window.location.href='home.html'">
        <img src="logo.png" alt="StudentHomes" class="brand-logo">
      </div>
      <nav class="nav-links">
        <!-- populated by data.js -->
      </nav>
    </header>


    <main class="admin-dashboard">
      <div class="container">
        <div class="dashboard-header">
          <div class="header-content">
            <h1>Admin Dashboard</h1>
            <p>Welcome back! Here's what's happening today.</p>
          </div>
          <a href="admin-form.html" class="btn btn-primary">+ Add New Property</a>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">🏠</div>
            <div class="stat-content">
              <h3 id="prop-count">0</h3>
              <p>Total Houses</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-content">
              <h3 id="active-count">0</h3>
              <p>Active Listings</p>
            </div>
          </div>
        </div>

        <section class="listings-section">
          <div class="section-header">
            <h2>Property Management</h2>
            <div class="search-wrapper">
              <input type="text" id="admin-search" placeholder="Search by name, school or area...">
            </div>
          </div>

          <!-- Desktop Table (Hidden on small screens via CSS) -->
          <div class="listings-table-container">
            <table>
              <thead>
                <tr>
                  <th>Property</th>
                  <th>Price</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="listings-body">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>

          <!-- Mobile Cards (Visible only on small screens via CSS) -->
          <div class="listings-cards" id="listings-cards">
            <!-- Rendered by JS -->
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    function toggleMenu() {
        const m = document.getElementById('mobile-menu');
        m.classList.toggle('active');
    }

    function renderDashboard(filter = '') {
      const user = window.getCurrentUser();
      if(!user || user.role !== 'admin') {
        window.location.href = "home.html";
        return;
      }

      const allListings = window.getListings();
      const listings = allListings.filter(l => 
        l.title.toLowerCase().includes(filter.toLowerCase()) ||
        l.school.toLowerCase().includes(filter.toLowerCase()) ||
        l.area.toLowerCase().includes(filter.toLowerCase())
      );

      document.getElementById('prop-count').textContent = allListings.length;
      document.getElementById('active-count').textContent = allListings.filter(h => h.status === 'Active').length;

      const body = document.getElementById('listings-body');
      const cards = document.getElementById('listings-cards');

      if(listings.length === 0) {
        body.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:3rem; color:var(--muted);">No results found</td></tr>';
        cards.innerHTML = '<p style="text-align:center; padding:2rem; color:var(--muted);">No results found</p>';
      } else {
        const rowsHtml = listings.map(l => `
          <tr>
            <td>
              <div class="property-cell">
                <img src="${l.photos[0]}" class="property-thumb" alt="">
                <div class="property-info">
                  <h4>${l.title}</h4>
                  <p>${l.school} • ${l.area}</p>
                </div>
              </div>
            </td>
            <td>₦${l.price.toLocaleString()}</td>
            <td><span class="status active">${l.status}</span></td>
            <td>
              <div class="actions">
                <button class="btn btn-small btn-edit" onclick="window.location.href='admin-form.html?edit=${l.id}'">Edit</button>
                <button class="btn btn-small btn-delete" onclick="handleDelete(${l.id})">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');

        const cardsHtml = listings.map(l => `
          <div class="listing-card">
            <img src="${l.photos[0]}" alt="">
            <div class="listing-card-content">
              <h4>${l.title}</h4>
              <p>${l.school} • ${l.area}</p>
              <div style="font-weight:700; color:var(--accent); margin-bottom:1rem;">₦${l.price.toLocaleString()}</div>
              <div class="listing-card-actions">
                <button class="btn btn-small btn-edit" style="flex:1;" onclick="window.location.href='admin-form.html?edit=${l.id}'">Edit</button>
                <button class="btn btn-small btn-delete" style="flex:1;" onclick="handleDelete(${l.id})">Delete</button>
              </div>
            </div>
          </div>
        `).join('');

        body.innerHTML = rowsHtml;
        cards.innerHTML = cardsHtml;
      }
    }

    async function handleDelete(id) {
      if(confirm('Delete this listing permanently?')) {
        const res = await window.deleteListing(id);
        if(!res.success) alert("Delete Error: " + res.error.message);
        renderDashboard();
      }
    }

    document.getElementById('admin-search').addEventListener('input', (e) => {
      renderDashboard(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderDashboard();
    });
  </script>
</body>
</html>
