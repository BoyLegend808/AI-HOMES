<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Listings</title>
  <link rel="stylesheet" href="listings.css">
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="home.html" class="logo">StudentHome</a>
      <ul class="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="listings.html" class="active">Listings</a></li>
        <li><a href="details.html">Details</a></li>
        <li><a href="admin.html">Landlord</a></li>
      </ul>
      <div class="mobile-menu" id="mobile-menu">
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="listings.html">Listings</a></li>
          <li><a href="details.html">Details</a></li>
          <li><a href="admin.html">Landlord</a></li>
        </ul>
      </div>
      <button class="mobile-menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">☰</button>
    </div>
  </nav>

  <main class="listings-page">
    <div class="container">
      <header class="listings-header">
        <button class="back-btn" onclick="history.back()">← Back</button>
        <div class="search-bar">
          <input type="text" placeholder="Search listings..." class="search-input" id="search-input">
          <button class="search-btn">🔍</button>
        </div>
      </header>

      <div class="filter-chips">
        <button class="chip" data-filter="price">Price</button>
        <button class="chip" data-filter="rooms">Rooms</button>
        <button class="chip" data-filter="type">Type</button>
        <button class="chip" data-filter="distance">Distance</button>
      </div>

      <aside class="filters" id="filters-panel">
        <div class="filters-header">
          <h2>Filters</h2>
          <button class="close-filters" onclick="toggleFilters()">×</button>
        </div>
        
        <div class="filter-group">
          <label for="price-range">Max Price: <span id="price-value">$1200</span></label>
          <input type="range" id="price-range" min="400" max="1500" value="1200">
        </div>
        
        <div class="filter-group">
          <label for="location">Location</label>
          <select id="location">
            <option value="all">All</option>
            <option value="Sycamore">Sycamore</option>
            <option value="Oakridge">Oakridge</option>
            <option value="Campus">Campus</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="type">Type</label>
          <select id="type">
            <option value="all">All</option>
            <option value="Shared">Shared</option>
            <option value="Private">Private</option>
            <option value="Studio">Studio</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label>Amenities</label>
          <label class="checkbox-label">
            <input type="checkbox" value="WiFi"> WiFi
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="Laundry"> Laundry
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="Parking"> Parking
          </label>
        </div>
        
        <button class="btn btn-primary" id="apply-filters">Apply Filters</button>
      </aside>

      <section class="listings-content">
        <div class="sort-bar">
          <h1>Listings</h1>
          <div class="sort-options">
            <select id="sort">
              <option>Sort by Price</option>
              <option>Newest</option>
              <option>Distance</option>
            </select>
          </div>
        </div>
        
        <div class="listings-grid" id="listings-grid">
          <!-- Cards populated by JS -->
        </div>
        
        <div class="pagination">
          <button class="btn btn-ghost">Prev</button>
          <span>1 of 3</span>
          <button class="btn btn-ghost">Next</button>
        </div>
      </section>

      <button class="map-view-btn" onclick="toggleMapView()">
        <span>🗺️</span> Map View
      </button>
    </div>
  </main>

  <!-- Bottom Sheet Modal -->
  <div class="modal-overlay" id="filter-modal">
    <div class="bottom-sheet">
      <div class="modal-header">
        <h3>Filter Options</h3>
        <button class="close-modal" onclick="closeModal()">×</button>
      </div>
      <div class="modal-content">
        <!-- Filter content will be dynamically inserted -->
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 StudentHome. All rights reserved.</p>
    </div>
  </footer>

  <script src="listings.js"></script>
  <script>
    // Filter chip functionality
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const filter = this.dataset.filter;
        openFilterModal(filter);
      });
    });

    function openFilterModal(filterType) {
      const modal = document.getElementById('filter-modal');
      const content = modal.querySelector('.modal-content');
      
      // Populate modal based on filter type
      let html = '';
      switch(filterType) {
        case 'price':
          html = `
            <div class="filter-group">
              <label>Price Range</label>
              <input type="range" min="100" max="2000" value="1200" class="modal-range">
              <div class="range-labels">
                <span>$100</span>
                <span>$2000</span>
              </div>
            </div>
          `;
          break;
        case 'rooms':
          html = `
            <div class="filter-group">
              <label>Number of Rooms</label>
              <div class="room-options">
                <button class="room-btn">1</button>
                <button class="room-btn">2</button>
                <button class="room-btn">3</button>
                <button class="room-btn">4+</button>
              </div>
            </div>
          `;
          break;
        case 'type':
          html = `
            <div class="filter-group">
              <label>Property Type</label>
              <div class="type-options">
                <label><input type="radio" name="type" value="all" checked> All</label>
                <label><input type="radio" name="type" value="Shared"> Shared</label>
                <label><input type="radio" name="type" value="Private"> Private</label>
                <label><input type="radio" name="type" value="Studio"> Studio</label>
              </div>
            </div>
          `;
          break;
        case 'distance':
          html = `
            <div class="filter-group">
              <label>Distance from Campus</label>
              <div class="distance-options">
                <button class="distance-btn">Within 1km</button>
                <button class="distance-btn">Within 3km</button>
                <button class="distance-btn">Within 5km</button>
                <button class="distance-btn">Any</button>
              </div>
            </div>
          `;
          break;
      }
      
      content.innerHTML = html + '<button class="btn btn-primary modal-apply" onclick="applyModalFilter()">Apply</button>';
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('filter-modal').classList.remove('active');
    }

    function applyModalFilter() {
      closeModal();
      // Apply filter logic here
    }

    function toggleFilters() {
      const panel = document.getElementById('filters-panel');
      panel.classList.toggle('active');
    }

    function toggleMapView() {
      alert('Map view coming soon!');
    }

    // Close modal when clicking outside
    document.getElementById('filter-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>
</body>

</html>
