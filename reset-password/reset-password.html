<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password - StudentHome</title>
  <meta name="description" content="Set a new password for your StudentHome account.">
  <meta property="og:title" content="Reset Your Password - StudentHome">
  <meta property="og:description" content="Set a new password for your StudentHome account.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="reset-password.css">
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="logo" onclick="window.location.href='../home/home.html'">
          <img src="../assets/logo.png" alt="StudentHomes" class="brand-logo">
        </div>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list">
            <li><a href="../home/home.html">Home</a></li>
            <li><a href="../about/about.html">About</a></li>
            <li><a href="../shop/shop.html">Browse Houses</a></li>
            <li><a href="../shop/shop.html">Hot Deals</a></li>
            <li><a href="../contact/contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right">
        <button class="sh-theme-toggle nav-theme-btn" id="nav-theme-toggle" aria-label="Toggle light/dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </header>
    <div class="nav-overlay"></div>

    <div class="auth-wrapper">
      <div class="auth-card">
        <h2>Set New Password</h2>
        <p>Choose a strong password you can remember.</p>

        <div class="form-group">
          <label>New Password</label>
          <div class="password-wrap">
            <input type="password" id="new-pass" class="form-control password-input" placeholder="New password" />
            <button type="button" id="toggle-new-pass" class="password-toggle" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="confirm-pass" class="form-control password-input" placeholder="Confirm password" />
            <button type="button" id="toggle-confirm-pass" class="password-toggle" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="password-strength" id="password-strength">
          <div class="strength-bar">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
          <div class="strength-text" id="strength-text"></div>
        </div>

        <button class="auth-btn" id="btn-update-pass">Update Password</button>
        <div class="hint" id="reset-hint"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/security.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/enhancements.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
