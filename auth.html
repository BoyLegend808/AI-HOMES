<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <style>
    .auth-wrapper {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: var(--bg-dark);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid var(--card-border);
    }
    .auth-card h2 {
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }
    .auth-card p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--text-main);
      padding: 0.9rem 1rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }
    .auth-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .auth-btn:hover {
      background: #e87b51;
    }
    .toggle-auth {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .toggle-auth span {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="logo" onclick="window.location.href='home.html'">
        <img src="logo.png" alt="StudentHomes" class="brand-logo">
      </div>
      <nav class="nav-links">
        <ul class="nav-list">
          <li><a href="home.html" class="active">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="shop.html">Browse Houses</a></li>
          <li><a href="listings.html">Hot Deals</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <button class="mobile-menu-toggle" aria-label="Toggle menu">
        <span class="hamburger-box">
          <span class="hamburger-inner"></span>
        </span>
      </button>
    </header>
    <div class="nav-overlay"></div>

    <div class="auth-wrapper">
      <div id="login-view" class="auth-card">
        <h2>Welcome Back</h2>
        <p>Login to your StudentHome account</p>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="you@university.edu" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" class="form-control" placeholder="••••••••" />
        </div>

        <button class="auth-btn" id="btn-login">Login</button>

        <div class="toggle-auth">
          Don't have an account? <span id="go-to-reg">Register</span>
        </div>
      </div>

      <div id="reg-view" class="auth-card hidden">
        <h2>Create Account</h2>
        <p>Join StudentHome today as a Student</p>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@university.edu" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="reg-phone" class="form-control" placeholder="080..." />
        </div>
        <div class="form-group">
          <label>University</label>
          <select id="reg-uni" class="form-control" style="appearance:none; background:var(--bg-panel); color:white;">
            <option value="">Select University</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-pass" class="form-control" placeholder="••••••••" />
        </div>

        <button class="auth-btn" id="btn-reg">Register</button>

        <div class="toggle-auth">
          Already have an account? <span id="go-to-login">Login</span>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js?v=999"></script>
  <script src="auth.js"></script>
</body>
</html>
