<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Add House</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <style>
    .admin-form-wrapper {
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    .admin-form-wrapper h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.8rem;
      border-radius: 12px;
      font-family: inherit;
    }
    .form-control:focus { outline: none; border-color: var(--accent); }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      padding: 1rem;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="logo">
        <span class="logo-icon">SH</span> 
        <span class="logo-text" style="display:none;">Student</span>
      </div>
      <nav class="nav-links">
        <a href="admin.html">← Back</a>
      </nav>
    </header>

    <main class="admin-form-wrapper">
      <h2 id="form-title">Add New Listing</h2>
      
      <div class="form-group">
        <label>Property Title</label>
        <input type="text" id="add-title" class="form-control" placeholder="e.g. Nice 2 Bedroom Flat">
      </div>

      <div class="form-group">
        <label>University</label>
        <select id="add-school" class="form-control">
          <option value="">Select School</option>
        </select>
      </div>

      <div class="form-group">
        <label>Area</label>
        <select id="add-area" class="form-control">
          <option value="">Select Area</option>
        </select>
      </div>

      <div class="form-group">
        <label>Property Type</label>
        <select id="add-type" class="form-control">
          <option value="">Select Type</option>
        </select>
      </div>

      <div class="form-group">
        <label>Price (₦)</label>
        <input type="number" id="add-price" class="form-control" placeholder="e.g. 150000">
      </div>

      <div class="form-group">
        <label>Number of Rooms</label>
        <input type="number" id="add-rooms" class="form-control" placeholder="1">
      </div>

      <div class="form-group">
        <label>Image URLs (Provide 3 image links)</label>
        <input type="url" id="add-img1" class="form-control" placeholder="Image URL 1" style="margin-bottom:0.5rem;">
        <input type="url" id="add-img2" class="form-control" placeholder="Image URL 2" style="margin-bottom:0.5rem;">
        <input type="url" id="add-img3" class="form-control" placeholder="Image URL 3">
      </div>

      <div class="form-group">
        <label>Contact Phone</label>
        <input type="text" id="add-phone" class="form-control" placeholder="080...">
      </div>
      
      <div class="form-group">
        <label>Contact WhatsApp</label>
        <input type="text" id="add-wa" class="form-control" placeholder="080...">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="add-desc" class="form-control" rows="4" placeholder="Important details..."></textarea>
      </div>

      <button class="btn-submit" id="btn-submit" onclick="submitHouse()">Add House</button>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    let editingId = null;

    document.addEventListener('DOMContentLoaded', () => {
      const user = window.getCurrentUser();
      if(!user || user.role !== 'admin') {
        alert("Access Denied. Admins only.");
        window.location.href = "home.html";
        return;
      }

      // Populate Select Options First
      const schoolSelect = document.getElementById('add-school');
      Object.keys(window.NIGERIA_UNIVERSITIES).forEach(school => {
        const op = document.createElement('option');
        op.value = school; op.textContent = school;
        schoolSelect.appendChild(op);
      });

      const typeSelect = document.getElementById('add-type');
      window.HOUSE_TYPES.forEach(t => {
        const op = document.createElement('option');
        op.value = t; op.textContent = t;
        typeSelect.appendChild(op);
      });

      // Check if Editing
      const params = new URLSearchParams(window.location.search);
      editingId = params.get('edit');
      
      if(editingId) {
        const house = window.getListingById(editingId);
        if(house) {
          document.getElementById('form-title').textContent = "Edit Property";
          document.getElementById('btn-submit').textContent = "Save Changes";
          
          document.getElementById('add-title').value = house.title;
          document.getElementById('add-price').value = house.price;
          document.getElementById('add-rooms').value = house.rooms;
          document.getElementById('add-type').value = house.type;
          document.getElementById('add-phone').value = house.contact?.phone || '';
          document.getElementById('add-wa').value = house.contact?.whatsapp || '';
          document.getElementById('add-desc').value = house.description || '';
          
          if(house.photos && house.photos.length > 0) document.getElementById('add-img1').value = house.photos[0];
          if(house.photos && house.photos.length > 1) document.getElementById('add-img2').value = house.photos[1];
          if(house.photos && house.photos.length > 2) document.getElementById('add-img3').value = house.photos[2];

          // Trigger school change event manually to load areas
          schoolSelect.value = house.school;
          schoolSelect.dispatchEvent(new Event('change'));
          document.getElementById('add-area').value = house.area;
        }
      }
    });

    document.getElementById('add-school').addEventListener('change', (e) => {
      const areaSelect = document.getElementById('add-area');
      areaSelect.innerHTML = '<option value="">Select Area</option>';
      const areas = window.NIGERIA_UNIVERSITIES[e.target.value] || [];
      areas.forEach(a => {
        const op = document.createElement('option');
        op.value = a;
        op.textContent = a;
        areaSelect.appendChild(op);
      });
    });

    function submitHouse() {
      const title = document.getElementById('add-title').value;
      const school = document.getElementById('add-school').value;
      const area = document.getElementById('add-area').value;
      const type = document.getElementById('add-type').value;
      const price = parseInt(document.getElementById('add-price').value);
      const rooms = parseInt(document.getElementById('add-rooms').value);
      const img1 = document.getElementById('add-img1').value;
      const img2 = document.getElementById('add-img2').value;
      const img3 = document.getElementById('add-img3').value;
      const phone = document.getElementById('add-phone').value;
      const whatsapp = document.getElementById('add-wa').value;
      const desc = document.getElementById('add-desc').value;

      if(!title || !school || !area || !type || !price || !img1 || !phone) {
        alert("Please fill in all major fields.");
        return;
      }

      const house = {
        id: editingId ? parseInt(editingId) : Date.now(),
        title, school, area, type, price, rooms,
        status: "Active",
        photos: [img1, img2, img3].filter(i=>i),
        description: desc,
        contact: { phone, whatsapp }
      };

      if(editingId) {
        window.updateListing(house);
        alert("House updated successfully!");
      } else {
        window.addListing(house);
        alert("House added successfully!");
      }
      
      window.location.href = "admin.html";
    }
  </script>
</body>
</html>
