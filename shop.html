<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <style>
    .shop-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }
    .shop-header h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    
    .cool-filter {
      background: var(--bg-dark);
      padding: 1rem;
      border-radius: 16px;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .filter-row {
      display: flex;
      gap: 0.5rem;
    }
    .filter-select {
      flex: 1;
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.8rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    .filter-select:focus {
      border-color: var(--accent);
    }
    .btn-filter {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      padding-top: 0;
    }
    
    .list-card {
      background: var(--bg-dark);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .list-card:hover {  transform: translateY(-4px); }
    .list-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .list-info {
      padding: 1rem;
    }
    .list-info h3 {
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
    }
    .list-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }
    .list-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-price {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 600;
    }
    .list-type {
      background: rgba(255,255,255,0.05);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="logo">
        <span class="logo-icon">SH</span> 
        <span class="logo-text" style="display: none;">Student</span>
      </div>
      <nav class="nav-links"></nav>
    </header>

    <main>
      <div class="shop-header">
        <h2>Available Houses</h2>
        
        <div class="cool-filter">
          <div class="filter-row">
            <select id="flt-school" class="filter-select">
              <option value="">Select University</option>
            </select>
          </div>
          <div class="filter-row">
            <select id="flt-area" class="filter-select">
              <option value="">Select Area / Location</option>
            </select>
            <select id="flt-type" class="filter-select">
              <option value="">House Type</option>
            </select>
          </div>
          <button class="btn-filter" onclick="applyFilters()">Apply Filter</button>
        </div>
      </div>

      <div class="shop-grid" id="shop-container">
        <!-- Rendered by js -->
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const filterSchool = document.getElementById('flt-school');
    const filterArea = document.getElementById('flt-area');
    const filterType = document.getElementById('flt-type');
    let allListings = [];

    document.addEventListener('DOMContentLoaded', () => {
      // populate schools
      Object.keys(window.NIGERIA_UNIVERSITIES).forEach(school => {
        const op = document.createElement('option');
        op.value = school;
        op.textContent = school;
        filterSchool.appendChild(op);
      });

      // populate types
      window.HOUSE_TYPES.forEach(type => {
        const op = document.createElement('option');
        op.value = type;
        op.textContent = type;
        filterType.appendChild(op);
      });

      allListings = window.getListings();
      renderShopGrid(allListings);
    });

    filterSchool.addEventListener('change', (e) => {
      filterArea.innerHTML = '<option value="">Select Area / Location</option>';
      const areas = window.NIGERIA_UNIVERSITIES[e.target.value] || [];
      areas.forEach(area => {
        const op = document.createElement('option');
        op.value = area;
        op.textContent = area;
        filterArea.appendChild(op);
      });
    });

    function applyFilters() {
      const sch = filterSchool.value;
      const ar = filterArea.value;
      const t = filterType.value;

      const filtered = allListings.filter(l => {
        let match = true;
        if(sch && l.school !== sch) match = false;
        if(ar && l.area !== ar) match = false;
        if(t && l.type !== t) match = false;
        return match;
      });

      renderShopGrid(filtered);
    }

    function renderShopGrid(listings) {
      const container = document.getElementById('shop-container');
      if(listings.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);text-align:center;">No houses found matching your criteria.</p>';
        return;
      }
      container.innerHTML = listings.map(l => `
        <div class="list-card" onclick="window.location.href='details.html?id=${l.id}'">
          <img src="${l.photos[0]}" alt="${l.title}">
          <div class="list-info">
            <h3>${l.title}</h3>
            <div class="list-meta">${l.school} • ${l.area}</div>
            <div class="list-price-row">
              <span class="list-price">₦${l.price.toLocaleString()}</span>
              <span class="list-type">${l.type}</span>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
