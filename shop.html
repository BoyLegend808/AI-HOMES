<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <style>
    .shop-header {
      padding: 1.5rem 0;
      margin-bottom: 2rem;
    }
    .shop-header h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }
    
    .cool-filter {
      background: var(--bg-panel);
      padding: 1.5rem;
      border-radius: 20px;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      border: 1px solid var(--card-border);
    }
    .filter-row {
      display: flex;
      flex: 1;
      gap: 1rem;
      min-width: 250px;
    }
    .filter-select {
      flex: 1;
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-select:focus {
      border-color: var(--accent);
    }
    .btn-filter {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-filter:hover { background: #e87b51; transform: translateY(-2px); }
    
    .shop-grid {
      display: grid;
      /* HUGE UPGRADE: Fluid grid that spans naturally across screen space! */
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }
    
    .list-card {
      background: var(--bg-panel);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .list-card:hover {  
      transform: translateY(-8px); 
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border-color: rgba(217, 108, 66, 0.3);
    }
    .list-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .list-info {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .list-info h3 {
      font-size: 1.25rem;
      margin-bottom: 0.4rem;
    }
    .list-meta {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      flex: 1;
    }
    .list-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-price {
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 700;
    }
    .list-type {
      background: rgba(255,255,255,0.05);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .filter-row { flex-direction: column; }
      .cool-filter { flex-direction: column; }
      .btn-filter { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="logo" onclick="window.location.href='home.html'">
        <img src="logo.png" alt="StudentHomes" class="brand-logo">
      </div>
      <nav class="nav-links"></nav>
    </header>

    <main>
      <div class="shop-header">
        <h2>Available Houses</h2>
        
        <div class="cool-filter">
          <div class="filter-row">
            <select id="flt-school" class="filter-select">
              <option value="">Select University</option>
            </select>
          </div>
          <div class="filter-row">
            <select id="flt-area" class="filter-select">
              <option value="">Select Area / Location</option>
            </select>
            <select id="flt-type" class="filter-select">
              <option value="">House Type</option>
            </select>
          </div>
          <button class="btn-filter" onclick="applyFilters()">Apply Filter</button>
        </div>
      </div>

      <div class="shop-grid" id="shop-container">
        <!-- Rendered by js -->
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const filterSchool = document.getElementById('flt-school');
    const filterArea = document.getElementById('flt-area');
    const filterType = document.getElementById('flt-type');
    let allListings = [];

    document.addEventListener('DOMContentLoaded', () => {
      // Show logo text on inner pages
      const lt = document.querySelector('.logo-text');
      if(lt && window.innerWidth > 480) lt.style.display = 'inline-block';

      Object.keys(window.NIGERIA_UNIVERSITIES).forEach(school => {
        const op = document.createElement('option');
        op.value = school;
        op.textContent = school;
        filterSchool.appendChild(op);
      });

      window.HOUSE_TYPES.forEach(type => {
        const op = document.createElement('option');
        op.value = type;
        op.textContent = type;
        filterType.appendChild(op);
      });

      allListings = window.getListings();
      renderShopGrid(allListings);
    });

    filterSchool.addEventListener('change', (e) => {
      filterArea.innerHTML = '<option value="">Select Area / Location</option>';
      const areas = window.NIGERIA_UNIVERSITIES[e.target.value] || [];
      areas.forEach(area => {
        const op = document.createElement('option');
        op.value = area;
        op.textContent = area;
        filterArea.appendChild(op);
      });
    });

    function applyFilters() {
      const sch = filterSchool.value;
      const ar = filterArea.value;
      const t = filterType.value;

      const filtered = allListings.filter(l => {
        let match = true;
        if(sch && l.school !== sch) match = false;
        if(ar && l.area !== ar) match = false;
        if(t && l.type !== t) match = false;
        return match;
      });

      renderShopGrid(filtered);
    }

    function renderShopGrid(listings) {
      const container = document.getElementById('shop-container');
      if(listings.length === 0) {
        container.innerHTML = window.getEmptyStateHTML("Oops! No houses found", "We couldn't find any pad matching those filters. Try searching for a different school or area.");
        return;
      }
      container.innerHTML = listings.map(l => `
        <div class="list-card reveal" onclick="window.location.href='details.html?id=${l.id}'">
          <img src="${l.photos[0]}" alt="${l.title}">
          <div class="list-info">
            <h3>${l.title}</h3>
            <div class="list-meta">${l.school} • ${l.area}</div>
            <div class="list-price-row">
              <span class="list-price">₦${l.price.toLocaleString()}</span>
              <span class="list-type">${l.type}</span>
            </div>
          </div>
        </div>
      `).join('');

      if(window.initReveal) window.initReveal();
    }
  </script>
</body>
</html>
