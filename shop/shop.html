<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Student Housing | Filter by University, Area & Price - StudentHome</title>
  <meta name="description" content="Search and filter student housing by university, campus area, house type and price. Find your perfect student accommodation today.">
  <meta property="og:title" content="Browse Student Housing - StudentHome">
  <meta property="og:description" content="Search and filter student housing by university, campus area, house type and price.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="shop.css">
</head>

<body>
  <a class="skip-to-content" href="#main-content">Skip to main content</a>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="logo" onclick="window.location.href='../home/home.html'">
          <img src="../assets/logo.png" alt="StudentHomes — go to homepage" class="brand-logo">
        </div>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list is-loading">
            <li></li><li></li><li></li><li></li><li></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right">
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </header>
    <div class="nav-overlay"></div>

    <main id="main-content">
      <div id="recently-viewed-section" style="display:none; margin-bottom: 3rem;">
        <h3 style="font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-muted);">Recently Viewed</h3>
        <div class="shop-grid" id="recent-container" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem;"></div>
      </div>

      <button class="back-link-btn" onclick="window.location.href='../home/home.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          Back to Home
      </button>

      <div class="shop-header" id="shop-header">
        <h2>Available Houses</h2>

        <div class="cool-filter">
          <div class="filter-row">
            <select id="flt-school" class="filter-select">
              <option value="">Select University</option>
            </select>
          </div>
          <div class="filter-row">
            <select id="flt-area" class="filter-select">
              <option value="">Select Area / Location</option>
            </select>
            <select id="flt-type" class="filter-select">
              <option value="">House Type</option>
            </select>
          </div>
          <div class="filter-row price-filter-row">
            <label style="color:var(--text-muted);font-size:0.95rem;white-space:nowrap;">Max Price:</label>
            <input type="range" id="flt-price" min="50000" max="1500000" step="50000" value="1500000" style="flex:1;">
            <span id="price-display" style="font-weight:700;color:var(--accent);">₦1,500,000</span>
          </div>
          <button class="btn-filter" onclick="applyFilters()">Apply Filter</button>
        </div>
      </div>

      <div class="sort-bar">
        <label for="flt-sort">Sort by:</label>
        <select id="flt-sort" class="sort-select">
          <option value="newest">Newest First</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="name-az">Name: A-Z</option>
        </select>
        <span class="results-count" id="results-count"></span>
      </div>

      <div class="shop-grid" id="shop-container">
        <!-- Rendered by js -->
      </div>
    </main>
    
    <div class="mobile-sticky-action-bar">
      <button onclick="document.getElementById('shop-header').scrollIntoView({behavior: 'smooth'})">⚙ Filters</button>
      <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⬆ Top</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/data.js"></script>
  <script src="../js/enhancements.js"></script>
  <script src="shop.js"></script>
</body>

</html>
