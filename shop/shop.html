<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Student Housing | Filter by University, Area & Price - StudentHome</title>
  <meta name="description"
    content="Search and filter student housing by university, campus area, house type and price. Find your perfect student accommodation today.">
  <meta property="og:title" content="Browse Student Housing - StudentHome">
  <meta property="og:description"
    content="Search and filter student housing by university, campus area, house type and price.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../js/nav.css?v=2">
  <link rel="stylesheet" href="shop.css?v=3">
</head>

<body>
  <a class="skip-to-content" href="#main-content">Skip to main content</a>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="logo" onclick="window.location.href='../home/home.html'">
          <img src="../assets/logo.png" alt="StudentHomes — go to homepage" class="brand-logo">
        </div>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list is-loading">
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right">
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </header>
    <div class="nav-overlay"></div>

    <main id="main-content" style="padding-bottom: 150px;">
      <div id="recently-viewed-section" style="display:none; margin-bottom: 3rem;">
        <h3 style="font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-muted);">Recently Viewed</h3>
        <div class="shop-grid" id="recent-container"
          style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem;"></div>
      </div>

      <button class="back-link-btn" onclick="window.location.href='../home/home.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to Home
      </button>

      <div class="shop-header" id="shop-header">
        <div class="shop-header-top">
          <h2>Available Houses</h2>
          <span class="results-count" id="results-count"></span>
        </div>

        <!-- Modern Filter Bar -->
        <div class="filter-bar-modern">
          <div class="filter-search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="flt-search" placeholder="Search by title, location, or area...">
          </div>
          
          <div class="filter-chips">
            <select id="flt-school" class="filter-chip">
              <option value="">🎓 University</option>
            </select>
            
            <select id="flt-area" class="filter-chip">
              <option value="">📍 Area</option>
            </select>
            
            <select id="flt-type" class="filter-chip">
              <option value="">🏠 Type</option>
            </select>
            
            <select id="flt-rooms" class="filter-chip">
              <option value="">🚪 Rooms</option>
              <option value="1">1 Room</option>
              <option value="2">2 Rooms</option>
              <option value="3">3 Rooms</option>
              <option value="4">4+ Rooms</option>
            </select>
          </div>
          
          <div class="filter-actions">
            <button class="btn-reset" onclick="resetFilters()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              Reset
            </button>
          </div>
        </div>
      </div>

      <div class="sort-bar">
        <label for="flt-sort">Sort by:</label>
        <select id="flt-sort" class="sort-select">
          <option value="newest">Newest First</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="name-az">Name: A-Z</option>
        </select>
      </div>

      <div class="shop-grid" id="shop-container">
        <!-- Rendered by js -->
      </div>
    </main>

    <div class="mobile-sticky-action-bar">
      <button onclick="document.getElementById('shop-header').scrollIntoView({behavior: 'smooth'})">⚙ Filters</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/data.js"></script>
  <script src="../js/enhancements.js"></script>
  <script src="shop.js"></script>
</body>

</html>
