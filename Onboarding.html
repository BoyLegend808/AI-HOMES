<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Find Your Pad</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #11151c;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .image-container {
      flex: 1;
      /* Using a modern architectural image to match the vibe */
      background: url('https://images.unsplash.com/photo-1541885084-517726a8fd3d?auto=format&fit=crop&q=80&w=1000') center/cover no-repeat;
      position: relative;
    }
    .image-container::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to bottom, transparent, #1c232d);
    }
    .bottom-panel {
      background-color: #1c232d;
      padding: 2.5rem 2rem 3.5rem 2rem;
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      margin-top: -30px;
      position: relative;
      z-index: 10;
      box-shadow: 0 -15px 40px rgba(0,0,0,0.4);
      animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .bottom-panel h1 {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 2.5rem;
      text-align: left;
      letter-spacing: -0.02em;
    }
    .btn-onboarding {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #ffffff;
      color: #11151c;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 1.1rem;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 2.5rem;
      transition: all 0.3s ease;
    }
    .btn-onboarding:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255,255,255,0.15);
    }
    .icon-row {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
    }
    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      position: relative;
    }
    .icon-box {
      width: 65px;
      height: 65px;
      background-color: #d96c42;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 10px 24px rgba(217, 108, 66, 0.35);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .icon-box:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 14px 30px rgba(217, 108, 66, 0.45);
    }
    .icon-item span {
      font-size: 0.95rem;
      font-weight: 500;
      color: #d96c42;
      letter-spacing: 0.02em;
    }
    /* Simple connecting lines behind icons to mimic the image's flow */
    .icon-row::after {
      content: '';
      position: absolute;
      top: 50%; left: 20%; right: 20%;
      height: 2px;
      background: rgba(217, 108, 66, 0.2);
      z-index: -1;
      display: none; /* optional: could add a line if needed */
    }
  </style>
</head>
<body>
  <div class="image-container"></div>
  <div class="bottom-panel">
    <h1>Find Your Perfect<br>Student Pad</h1>
    <a href="home.html" class="btn-onboarding">Onboarding</a>
    <div class="icon-row">
      <div class="icon-item">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <span>Search</span>
      </div>
      <div class="icon-item">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <span>Select</span>
      </div>
      <div class="icon-item">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </div>
        <span>Contact</span>
      </div>
    </div>
  </div>
</body>
</html>
