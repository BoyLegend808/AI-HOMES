<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details - StudentHome</title>
  <meta name="description" content="View property details, photos, pricing and contact the landlord directly. Verified student housing on StudentHome.">
  <meta property="og:title" content="Property Details - StudentHome">
  <meta property="og:description" content="View property details, photos, pricing and contact the landlord directly.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="details.css">
</head>

<body>
  <a class="skip-to-content" href="#main-content">Skip to main content</a>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="logo" onclick="window.location.href='../home/home.html'">
          <img src="../assets/logo.png" alt="StudentHomes — go to homepage" class="brand-logo">
        </div>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list">
            <li><a href="../home/home.html">Home</a></li>
            <li><a href="../about/about.html">About</a></li>
            <li><a href="../shop/shop.html" class="active">Browse Houses</a></li>
            <li><a href="../shop/shop.html">Hot Deals</a></li>
            <li><a href="../contact/contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right">
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </header>
    <div class="nav-overlay"></div>

    <main id="main-content">
      <!-- UI will be rendered by JS -->
    </main>
  </div>

  <div class="modal-overlay" id="contact-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h3>Owner Contacts</h3>
      <p style="color:var(--text-muted);margin-bottom:2rem;font-size:1.05rem;">Reach out to the landlord directly.</p>

      <a href="#" class="contact-option call" id="contact-call">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
          </path>
        </svg>
        <span id="call-text">Call</span>
      </a>

      <a href="#" class="contact-option whatsapp" id="contact-wa">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
          </path>
        </svg>
        <span id="wa-text">WhatsApp</span>
      </a>

      <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
        <h4 style="margin-bottom: 1rem; font-size: 1.1rem; color: #fff;">Message Manager</h4>
        <textarea id="inquiry-message" rows="3" 
          style="width: 100%; padding: 1rem; border-radius: 12px; background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem; resize: none; font-family: inherit;"
          placeholder="I'm interested in this property. Is it still available?"></textarea>
        <button class="btn-checkout" id="btn-send-inquiry" style="width: 100%;" onclick="sendInquiry()">Send Message</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox(); event.stopPropagation();">×</button>
    <button class="lightbox-btn lightbox-prev" onclick="prevLightboxImage(event)">❮</button>
    <img id="lightbox-img" src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&q=80&w=1200" alt="Enlarged view of selected property photo" onclick="event.stopPropagation()">
    <button class="lightbox-btn lightbox-next" onclick="nextLightboxImage(event)">❯</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/data.js"></script>
  <script src="../js/enhancements.js"></script>
  <script src="details.js"></script>
</body>

</html>
