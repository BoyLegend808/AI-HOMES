<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details - StudentHome</title>
  <meta name="description" content="View property details, photos, pricing and contact the landlord directly. Verified student housing on StudentHome.">
  <meta property="og:title" content="Property Details - StudentHome">
  <meta property="og:description" content="View property details, photos, pricing and contact the landlord directly.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../js/nav.css">
  <link rel="stylesheet" href="details.css">
</head>

<body>
  <a class="skip-to-content" href="#main-content">Skip to main content</a>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <div class="logo" onclick="window.location.href='../home/home.html'">
          <img src="../assets/logo.png" alt="StudentHomes — go to homepage" class="brand-logo">
        </div>
      </div>
      <div class="nav-center">
        <nav class="nav-links">
          <ul class="nav-list">
            <li><a href="../home/home.html">Home</a></li>
            <li><a href="../about/about.html">About</a></li>
            <li><a href="../shop/shop.html" class="active">Browse Houses</a></li>
            <li><a href="../shop/shop.html">Hot Deals</a></li>
            <li><a href="../contact/contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-right">
        <button class="sh-theme-toggle nav-theme-btn" id="nav-theme-toggle" aria-label="Toggle light/dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </header>
    <div class="nav-overlay"></div>

    <main id="main-content">
      <!-- UI will be rendered by JS -->
    </main>
  </div>

  <div class="modal-overlay" id="contact-modal">
    <div class="modal-content contact-card">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <!-- Owner Profile Header -->
      <div class="contact-card-header">
        <div class="owner-avatar" id="owner-avatar">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="owner-info">
          <span class="owner-label">Property Owner</span>
          <h3 class="owner-name" id="owner-name">Landlord</h3>
          <span class="owner-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#22c55e" stroke="none"><circle cx="12" cy="12" r="12"/><path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            Verified Owner
          </span>
        </div>
      </div>

      <!-- Divider -->
      <div class="contact-divider">
        <span>Contact directly</span>
      </div>

      <!-- Contact Buttons -->
      <div class="contact-buttons-grid">
        <a href="#" class="contact-btn contact-btn--call" id="contact-call">
          <div class="contact-btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <div class="contact-btn-text">
            <span class="contact-btn-label">Phone Call</span>
            <span class="contact-btn-sub" id="call-text">Tap to call</span>
          </div>
        </a>

        <a href="#" class="contact-btn contact-btn--wa" id="contact-wa">
          <div class="contact-btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
          </div>
          <div class="contact-btn-text">
            <span class="contact-btn-label">WhatsApp</span>
            <span class="contact-btn-sub" id="wa-text">Chat now</span>
          </div>
        </a>
      </div>

      <!-- Message Section -->
      <div class="contact-message-section">
        <label class="message-label" for="inquiry-message">Send a message</label>
        <textarea id="inquiry-message" rows="3"
          placeholder="Hi, I'm interested in this property. Is it still available?"></textarea>
        <button class="btn-send-inquiry" id="btn-send-inquiry" onclick="sendInquiry()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send Message
        </button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox(); event.stopPropagation();">×</button>
    <button class="lightbox-btn lightbox-prev" onclick="prevLightboxImage(event)">❮</button>
    <img id="lightbox-img" src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&q=80&w=1200" alt="Enlarged view of selected property photo" onclick="event.stopPropagation()">
    <button class="lightbox-btn lightbox-next" onclick="nextLightboxImage(event)">❯</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/security.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/enhancements.js"></script>
  <script src="details.js"></script>
</body>

</html>
