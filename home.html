<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHome - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="logo">
        <span class="logo-icon">SH</span> 
        <span class="logo-text" style="display: none;">Student</span>
      </div>
      <nav class="nav-links">
        <!-- populated by data.js -->
      </nav>
    </header>

    <main>
      <section class="featured-section">
        <div class="section-header">
          <h2>Featured Housing</h2>
          <div class="controls">
            <button class="nav-btn" onclick="document.getElementById('carousel').scrollBy(-160, 0)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button class="nav-btn" onclick="document.getElementById('carousel').scrollBy(160, 0)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>
        
        <div class="carousel" id="carousel">
          <!-- populated by js -->
        </div>
      </section>

      <section class="search-section">
        <div class="search-bar">
          <input type="text" placeholder="Select location, budget..." id="quick-search">
          <button class="search-btn" onclick="goToShop()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </section>

      <section class="about-section">
        <h2>About StudentHome</h2>
        <p>We bridge the gap to provide excellent student housing options for our university's students. We offer hassle-free bookings, simple rental agreements, and verified providers.</p>
        <div class="about-image"></div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    function renderFeatured() {
      const carousel = document.getElementById('carousel');
      const listings = window.getListings().slice(0, 5); // top 5
      carousel.innerHTML = listings.map(l => `
        <div class="house-card" onclick="window.location.href='details.html?id=${l.id}'">
          <div class="card-image" style="background-image: url('${l.photos[0]}')"></div>
          <div class="card-content">
            <h3>${l.title}</h3>
            <p>${l.rooms} bed • ${l.area}</p>
          </div>
        </div>
      `).join('');
    }
    
    function goToShop() {
       window.location.href = "shop.html";
    }

    document.addEventListener('DOMContentLoaded', renderFeatured);
  </script>
</body>
</html>
